# Publie l'appli sur GitHub Pages à chaque envoi de code.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main, claude/gallant-gates-wwtx8s]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site
        run: |
          mkdir _site
          cp -r index.html style.css app.js course.js sw.js manifest.webmanifest fonts icons _site/
          # Nouvelle version du cache hors ligne à chaque déploiement
          sed -i "s/__VERSION__/${GITHUB_SHA::8}/" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
